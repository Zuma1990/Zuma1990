<!DOCTYPE html>
<html>
<head>
  <title>Zuma1990 WebTV</title>
  <style>
    body { font-family: Arial, sans-serif; background: #111; color: #eee; text-align: center; }
    #video { margin-top: 20px; border: 2px solid #444; background: #222; }
    select { margin: 20px 0; padding: 8px; font-size: 18px; }
  </style>
</head>
<body>
  <h1>Zuma1990 WebTV</h1>
  <p>Select a channel:</p>
  <select id="channelSelect"></select>
  <video id="video" width="640" height="360" controls></video>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    // URL to your raw Playlist.m3u file on GitHub
    const playlistUrl = 'https://raw.githubusercontent.com/Zuma1990/Zuma1990/main/Playlist.m3u';

    // Helper to parse .m3u playlist
    async function loadPlaylist() {
      const response = await fetch(playlistUrl);
      const text = await response.text();
      const lines = text.split('\n');
      const channels = [];
      for(let i = 0; i < lines.length; i++){
        if(lines[i].startsWith('#EXTINF')){
          const name = lines[i].split(',')[1] || 'Unknown Channel';
          const url = lines[i+1]?.trim();
          if(url && url.startsWith('http')) {
            channels.push({name, url});
          }
        }
      }
      return channels;
    }

    // Populate channel selector
    async function initPlayer() {
      const select = document.getElementById('channelSelect');
      const video = document.getElementById('video');
      const channels = await loadPlaylist();
      channels.forEach(ch => {
        const option = document.createElement('option');
        option.value = ch.url;
        option.textContent = ch.name;
        select.appendChild(option);
      });

      function playStream(url) {
        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(url);
          hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = url;
        } else {
          alert('Your browser does not support HLS streaming.');
        }
      }

      select.onchange = () => playStream(select.value);
      if (channels.length) playStream(channels[0].url);
    }

    initPlayer();
  </script>
</body>
</html>
